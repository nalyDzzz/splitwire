name: Release

# Push a tag like v0.2.0 (see CONTRIBUTING.md, "Releasing") to build the
# installer and publish it as a GitHub release, with the latest.json the
# in-app updater reads.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history, for the release notes

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version $version. Run: node scripts/bump-version.mjs <version>"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "INSTALLER=Splitwire_${version}_x64-setup.exe" >> "$GITHUB_ENV"

      - name: Check the updater signing key is configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY (and _PASSWORD) repository secrets. See CONTRIBUTING.md."
            exit 1
          fi

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile
      - name: Build the installer
        run: pnpm build

      - name: Stage the installer
        shell: bash
        run: |
          mkdir -p release
          cp "target/release/bundle/nsis/$INSTALLER" release/

      # Authenticode signing (e.g. SignPath) goes here, before the updater
      # signature, so that signature covers the final file.

      - name: Sign the installer for the updater
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm --filter splitwire-desktop exec tauri signer sign --app-version "$VERSION" "$GITHUB_WORKSPACE/release/$INSTALLER"

      - name: Write release notes and the updater manifest
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body > generated.md
          # GitHub only lists merged pull requests; fall back to commit subjects
          # when changes were pushed directly.
          if grep -q "^## What's Changed" generated.md; then
            cp generated.md changes.md
          else
            previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
            {
              echo "## What's Changed"
              git log --no-merges --pretty='* %s' "${previous:+$previous..}$GITHUB_REF_NAME" | grep -v '^\* Release v' || true
              echo
              cat generated.md
            } > changes.md
          fi
          node scripts/updater-manifest.mjs \
            --version "$VERSION" \
            --installer "release/$INSTALLER" \
            --url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$INSTALLER" \
            --notes-file changes.md \
            --out release/latest.json
          { cat .github/release-notes.md; echo; cat changes.md; } > body.md

      - name: Checksums
        shell: bash
        run: |
          cd release
          sha256sum "$INSTALLER" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish the release
        shell: bash
        run: |
          prerelease=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Splitwire $VERSION" \
            --notes-file body.md \
            $prerelease
